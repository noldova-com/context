name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    uses: noldova-com/.github/.github/workflows/build-and-test.yml@03e1936493a45d8c0dd8e80bc247980a116fa9a6 # trial, before v2.1.0
    permissions:
      contents: read
      packages: read
    with:
      targets: linux-x64 linux-arm64 windows-x64 windows-arm64 macos-x64 macos-arm64
      publishes: true
