name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, 0.0.n, which scripts/config.ts holds at the commit
        required: true
        type: string
      commit:
        description: The full hash of the commit on main to build and release
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    uses: noldova-com/.github/.github/workflows/release-npm.yml@dc42ac82ad6aa68f8d57a9f136d0de171a44e7e3 # v1.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      environment: release
