name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, 0.0.n, which version.json holds at the commit
        required: true
        type: string
      commit:
        description: The full hash of the commit on main to build and release
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    uses: noldova-com/.github/.github/workflows/release-npm.yml@ef1d545271172e4f56fd3dbb75b9ef79b9a66d3e # v2.8.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      environment: release

  dependents:
    needs: release
    uses: noldova-com/.github/.github/workflows/update-dependents.yml@ef1d545271172e4f56fd3dbb75b9ef79b9a66d3e # v2.8.0
    permissions:
      contents: read
      packages: read
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
    secrets: inherit
