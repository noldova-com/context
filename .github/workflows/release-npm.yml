name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, 0.0.n, which scripts/config.ts holds at the commit
        required: true
        type: string
      commit:
        description: The full hash of the commit on main to build and release
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    uses: noldova-com/.github/.github/workflows/release-npm.yml@6e2ab8efb06aff6f0fdb9c4ac91c623c74359c30 # v1.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      environment: release
    secrets:
      # For the first publish only, since npm's trusted publishing needs each package to exist; this line goes once each has its trusted publisher.
      registry-token: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
